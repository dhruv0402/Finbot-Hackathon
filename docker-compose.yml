version: '3.8'

services:
  finbot-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finbot-platform
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLAMA_API_URL=${LLAMA_API_URL:-http://localhost:11434/api/generate}
    volumes:
      - ./backend/data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/market/tickers"]
      interval: 30s
      timeout: 5s
      retries: 3
