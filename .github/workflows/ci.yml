name: FinBot AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-lint:
    name: Code Quality & Security Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Linting & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 bandit

    - name: Secret Leak Detection (Bandit)
      run: |
        # Scan for hardcoded credentials/secrets with severity high
        bandit -r backend/app -ll -ii || true

    - name: Python Syntax & Formatting Verification
      run: |
        # Check critical syntax errors or undefined names
        flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

  backend-quant-and-rag-suite:
    name: Backend Quant & RAG Unittest Suite
    runs-on: ubuntu-latest
    needs: code-quality-and-lint
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies for FAISS & SciPy
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev libomp-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Quantitative Math, RAG & MarketProbe Tests
      run: |
        cd backend
        python test_backend.py

  frontend-build-and-bundle-audit:
    name: Frontend Build & Bundle Audit
    runs-on: ubuntu-latest
    needs: code-quality-and-lint
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Install Node Dependencies
      run: |
        cd frontend
        npm install

    - name: Build Production Vite React Bundle
      run: |
        cd frontend
        npm run build

    - name: Verify Single-Port Static Bundle Integrity
      run: |
        test -f frontend/dist/index.html || exit 1
        echo "✅ Production single-port asset distribution verified."
